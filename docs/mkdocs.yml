site_name: kinvas Documentation
site_url: https://nigh.github.io/kinvas/
copyright: "© 2023 Alethea Katherine Flowers, Licensed under Creative Commons CC BY-SA 4.0"
repo_url: "https://github.com/Nigh/kinvas"
edit_uri: edit/main/docs/docs
theme:
    name: material
    custom_dir: overrides
    logo: icon.webp
    favicon: icon.webp
    palette:
        scheme: slate
        primary: teal
        accent: light blue
    font:
        text: Nunito
        code: IBM Plex Mono
markdown_extensions:
    - admonition
    - def_list
    - attr_list
    - footnotes
    - pymdownx.highlight
    - pymdownx.superfences
    - pymdownx.magiclink
    - md_in_html
    - pymdownx.tasklist:
          custom_checkbox: true
nav:
    - "Home": home.md
    - "Standalone App": index.md
    - "Embedding": embedding.md
    - "Roadmap": roadmap.md
    - "Development": development.md
    - "License": license.md
